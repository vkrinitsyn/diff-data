[package]
name = "diff_data"
version = "0.4.0"
edition = "2024"
authors = ["Vladimir Krinitsyn <v.krinitsyn@gmail.com>", "DBinvent <support@dbinvent.com>"]
homepage = "https://vkrinitsyn.github.io/"
keywords = ["diff", "patch", "postgres", "data"]
documentation = "https://github.com/vkrinitsyn/diff-data"
description = "PostgreSQL data diff, as a library: the SQL that makes a target's rows a reference's. A schema and data diff is sge's"
license = "MIT"
repository = "https://github.com/vkrinitsyn/diff-data"


[[bin]]
name = "diff_data"
path = "src/main.rs"
# the command line is the binary's alone: a crate using diff_data as a library (sge, ytctl)
# leaves clap and tracing-subscriber out with default-features = false
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
# the messages, in locales/*.yml: compiled in, each in every language - see src/i18n.rs
rust-i18n = "4"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tokio = { version = "1", features = ["full"] }
bb8 = "0.9"
bb8-postgres = "0.9"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres-types = { version = "0.2", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = "1"
serde_json = "1"
schema_guard_tokio = "2.3"
diff_doc = "1.0"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
