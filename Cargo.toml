[package]
name = "diff_data"
version = "0.3.2"
edition = "2024"
authors = ["Vladimir Krinitsyn <v.krinitsyn@gmail.com>", "DBinvent <support@dbinvent.com>"]
homepage = "https://vkrinitsyn.github.io/"
keywords = ["diff", "patch"]
documentation = "https://github.com/vkrinitsyn/data-diff"
description = "DB data compare by md5 rows"
license = "MIT"
repository = "https://github.com/vkrinitsyn/data-diff"


[[bin]]
name = "diff_data"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rust-i18n = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
bb8 = "0.9"
bb8-postgres = "0.9"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres-types = { version = "0.2", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = "1"
serde_json = "1"
schema_guard_tokio = "2.3"
diff_doc = "0.6"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
