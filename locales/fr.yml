# [i18n] diff_data's messages in French (not reviewed): one file per language, every key in every
# file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, DA-Ennn, the same in every language (DD- is diff-doc's)
_version: 1

# src/ - the errors (DA-E001..E027): each starts with its code, the same in every language; its
# description is at docs.dbinvent.com. A new error takes the next code; a code is never reused
error.postgres: "DA-E001 erreur PostgreSQL : %{err}"
error.io: "DA-E002 erreur d'entrée/sortie : %{err}"
error.pool: "DA-E003 erreur du pool de connexions : %{err}"
error.no_primary_key: "DA-E004 la table %{table} n'a pas de clé primaire"
error.table_not_found: "DA-E005 table introuvable : %{table}"
error.column_mismatch: "DA-E006 la table cible %{target} n'a pas toutes les colonnes de la table de référence %{reference}"
error.cancelled: "DA-E007 la comparaison a été annulée"
error.yaml: "DA-E008 erreur YAML du fichier de sommes de contrôle : %{err}"
error.connection_string: "DA-E009 chaîne de connexion invalide : %{err}"
error.pool_create: "DA-E010 impossible de créer le pool de connexions : %{err}"
error.checksum_only_no_file: "DA-E011 checksum_only exige save_reference_checksums ou save_target_checksums : où enregistrer les sommes de contrôle"
error.no_reference_checksums: "DA-E012 le SQL à partir des sommes de contrôle exige reference_checksum_file"
error.no_target_checksums: "DA-E013 le SQL à partir des sommes de contrôle exige target_checksum_file"
error.stream_lock: "DA-E014 impossible de verrouiller le flux de sortie : %{err}"
error.too_long: "DA-E015 la durée estimée, %{seconds} s (%{hours} h), dépasse les %{max} s permises : force la lance quand même"
error.large_no_timestamp: "DA-E016 la table %{table} a plus d'un million de lignes et aucune colonne d'horodatage : indiquez-en une (timestamp_column), ou ajoutez la table à exclude_tables pour la comparer ligne par ligne"
error.checksum_open: "DA-E017 impossible d'ouvrir le fichier de sommes de contrôle %{path} : %{err}"
error.reference_db: "DA-E018 la base de référence : %{err}"
error.target_db: "DA-E019 la base cible : %{err}"
error.alternate_key: "DA-E020 clé alternative %{value} : attendu table:colonne[,colonne...]"
error.no_key_reference_checksums: "DA-E021 la table %{table} n'a pas de clé primaire : elle n'a pas de sommes de contrôle de référence"
error.no_key_target_checksums: "DA-E022 la table %{table} n'a pas de clé primaire : elle n'a pas de sommes de contrôle cibles"
error.cluster_no_key: "DA-E023 pas de clé primaire : ses lignes n'ont pas d'identité pour être comparées"
error.cluster_key_ignored: "DA-E024 %{column} est dans la clé et dans ignore_col"
error.cluster_ambiguous_id: "DA-E025 deux lignes donnent l'id [%{id}] : une valeur de clé contenant '|', ou une clé flottante - ses lignes n'ont pas d'identité unique pour être comparées"
error.recon_frame_key: "DA-E026 la clé de trame [%{key}] n'est pas un simple nom de colonne"
error.recon_ts_col: "DA-E027 la colonne de dernière mise à jour [%{column}] n'est pas un simple nom de colonne"

# src/main.rs - the command line's help
cli.about: "Compare les données de deux bases PostgreSQL et écrit le SQL (INSERT, UPDATE, DELETE) qui rend les lignes de la cible identiques à celles de la référence. Données seulement : pour une comparaison complète, schéma et données, utilisez sge (Schema Guard Enterprise), qui compare les schémas. diff_data est aussi une bibliothèque, pour sge, ytctl ou tout projet. Traduction non relue."
cli.reference_url: "Chaîne de connexion de la base de référence : les lignes que la cible doit reproduire"
cli.target_url: "Chaîne de connexion de la base cible : les lignes que le SQL modifie"
cli.output: "Le script SQL principal, ou avec --single-file l'unique fichier SQL"
cli.output_dir: "Répertoire des fichiers SQL par table (par défaut : celui du script principal)"
cli.table: "Une table à comparer : nom, ou référence:cible ; répétable (par défaut : toutes les tables de --reference-schema)"
cli.include_delete: "Écrire aussi les DELETE des lignes de la cible absentes de la référence"
cli.chunk_size: "Lignes comparées par une requête"
cli.ignore_column: "Une colonne non comparée ; répétable"
cli.alternate_key: "Une clé pour apparier les lignes au lieu de la clé primaire : table:col1,col2 ; répétable"
cli.exclude_real_pk: "Avec --alternate-key, omettre la vraie clé primaire des INSERT"
cli.exclude_ignored_columns: "Omettre les colonnes de --ignore-column du SQL"
cli.where_condition: "Une condition sur les lignes de la référence, sans WHERE : seules les lignes retenues sont comparées"
cli.single_file: "Écrire tout le SQL dans le fichier --output au lieu d'un fichier par table"
cli.reference_schema: "Le schéma de référence : sans --table, chacune de ses tables est comparée"
cli.target_schema: "Le schéma cible de ces tables (par défaut : --reference-schema)"
cli.exclude_table: "Une table de plus d'un million de lignes sans colonne d'horodatage, comparée ligne par ligne au lieu d'être refusée ; répétable"
cli.no_check_dependencies: "Ne pas trier les tables selon leurs clés étrangères"
cli.include_identity: "Écrire les colonnes d'identité dans les INSERT"
cli.exclude_identity: "Omettre les colonnes d'identité des INSERT (par défaut)"
cli.timestamp_column: "La colonne d'horodatage qui découpe une grande table (par défaut : une colonne update*, sinon create*)"
cli.force: "Lancer même si la durée estimée dépasse --max-etc-seconds"
cli.no_progress: "N'afficher aucune progression"
cli.reference_db_name: "Le nom de la base de référence, inscrit dans son fichier de sommes de contrôle"
cli.target_db_name: "Le nom de la base cible, inscrit dans son fichier de sommes de contrôle"
cli.max_etc_seconds: "La plus longue durée estimée, en secondes, qu'une comparaison accepte sans --force"
cli.reference_checksum_file: "Générer le SQL à partir de ces sommes de contrôle de la référence, avec --target-checksum-file"
cli.target_checksum_file: "Générer le SQL à partir de ces sommes de contrôle de la cible, avec --reference-checksum-file"
cli.save_reference_checksums: "Enregistrer les sommes de contrôle de la référence dans ce fichier"
cli.save_target_checksums: "Enregistrer les sommes de contrôle de la cible dans ce fichier"
cli.checksum_only: "Calculer et enregistrer les sommes de contrôle seulement, sans SQL"
cli.locale: "La langue des messages : en, ru, fr, de, zh, ja (par défaut : LANG)"

# src/main.rs - the command line's progress and report: no code, none is an error
progress.table_start: "[%{index}/%{total}] %{table}"
progress.row_processed: "%{table} : %{count} lignes"
progress.table_diff_complete: "%{table} : %{inserts} insertions, %{updates} mises à jour"
progress.table_delete_complete: "%{table} : %{deletes} suppressions"
progress.sorting_dependencies: "Tri des tables selon leurs clés étrangères"
progress.estimation_start: "Estimation de la durée pour %{total} tables"
progress.estimation_table_done: "%{table} : environ %{seconds} s (%{strategy})"
progress.estimation_complete: "Durée estimée : %{seconds} s"
progress.chunk_progress: "%{table} : tranche %{index}/%{total}"
report.header: "Comparaison des données :"
report.no_differences: "  aucune différence"
report.table_line: "  %{table} : %{inserts} insertions, %{updates} mises à jour, %{deletes} suppressions"
report.master_script: "SQL : %{path}"
report.warnings_header: "Avertissements :"
report.warning_line: "  %{message}"
