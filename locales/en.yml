# [i18n] diff_data's messages in English: one file per language, every key in every
# file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, DA-Ennn, the same in every language (DD- is diff-doc's)
_version: 1

# src/ - the errors (DA-E001..E027): each starts with its code, the same in every language; its
# description is at docs.dbinvent.com. A new error takes the next code; a code is never reused
error.postgres: "DA-E001 PostgreSQL error: %{err}"
error.io: "DA-E002 I/O error: %{err}"
error.pool: "DA-E003 connection pool error: %{err}"
error.no_primary_key: "DA-E004 table %{table} has no primary key"
error.table_not_found: "DA-E005 table not found: %{table}"
error.column_mismatch: "DA-E006 the target table %{target} lacks columns of the reference table %{reference}"
error.cancelled: "DA-E007 the diff was cancelled"
error.yaml: "DA-E008 checksum file YAML error: %{err}"
error.connection_string: "DA-E009 invalid connection string: %{err}"
error.pool_create: "DA-E010 cannot create the connection pool: %{err}"
error.checksum_only_no_file: "DA-E011 checksum_only needs save_reference_checksums or save_target_checksums: where to save the checksums"
error.no_reference_checksums: "DA-E012 the SQL from checksums needs reference_checksum_file"
error.no_target_checksums: "DA-E013 the SQL from checksums needs target_checksum_file"
error.stream_lock: "DA-E014 cannot lock the output stream: %{err}"
error.too_long: "DA-E015 the estimated time, %{seconds}s (%{hours}h), is over the %{max}s allowed: force runs it anyway"
error.large_no_timestamp: "DA-E016 table %{table} has over 1M rows and no timestamp column: name one (timestamp_column), or add the table to exclude_tables to diff it row by row"
error.checksum_open: "DA-E017 cannot open the checksum file %{path}: %{err}"
error.reference_db: "DA-E018 the reference database: %{err}"
error.target_db: "DA-E019 the target database: %{err}"
error.alternate_key: "DA-E020 alternate key %{value}: expected table:column[,column...]"
error.no_key_reference_checksums: "DA-E021 table %{table} has no primary key: it has no reference checksums"
error.no_key_target_checksums: "DA-E022 table %{table} has no primary key: it has no target checksums"
error.cluster_no_key: "DA-E023 no primary key: its rows have no identity to compare by"
error.cluster_key_ignored: "DA-E024 %{column} is in the key and in ignore_col"
error.cluster_ambiguous_id: "DA-E025 two rows render the id [%{id}]: a key value holding '|', or a float key - its rows have no one identity to compare by"
error.recon_frame_key: "DA-E026 the frame key [%{key}] is not a plain column name"
error.recon_ts_col: "DA-E027 the last-update column [%{column}] is not a plain column name"

# src/main.rs - the command line's help
cli.about: "Compares the data of two PostgreSQL databases and writes the SQL (INSERT, UPDATE, DELETE) that makes the target's rows the reference's. Data only: for a comprehensive diff, schema and data, use sge (Schema Guard Enterprise), which compares the schemas. diff_data is also a library, for sge, ytctl or any project."
cli.reference_url: "Connection string of the reference database: the rows the target is made the same as"
cli.target_url: "Connection string of the target database: the rows the SQL changes"
cli.output: "The master SQL script, or with --single-file the one SQL file"
cli.output_dir: "Directory of the per-table SQL files (default: the master script's)"
cli.table: "A table to compare: name, or reference:target; repeatable (default: every table of --reference-schema)"
cli.include_delete: "Also write DELETEs of the target's rows the reference lacks"
cli.chunk_size: "Rows compared by one query"
cli.ignore_column: "A column not compared; repeatable"
cli.alternate_key: "A key to match rows by instead of the primary key: table:col1,col2; repeatable"
cli.exclude_real_pk: "With --alternate-key, leave the real primary key out of INSERTs"
cli.exclude_ignored_columns: "Leave the --ignore-column columns out of the SQL"
cli.where_condition: "A condition on the reference's rows, without WHERE: only the rows it takes are compared"
cli.single_file: "Write all the SQL into the --output file instead of a file per table"
cli.reference_schema: "The reference schema: with no --table, each of its tables is compared"
cli.target_schema: "The target schema of those tables (default: --reference-schema)"
cli.exclude_table: "A table of over 1M rows without a timestamp column, compared row by row rather than refused; repeatable"
cli.no_check_dependencies: "Do not order the tables by their foreign keys"
cli.include_identity: "Write identity columns in INSERTs"
cli.exclude_identity: "Leave identity columns out of INSERTs (the default)"
cli.timestamp_column: "The timestamp column a large table is chunked by (default: an update*, else a create* column)"
cli.force: "Run even when the estimated time is over --max-etc-seconds"
cli.no_progress: "Print no progress"
cli.reference_db_name: "The reference database's name, recorded in its checksum file"
cli.target_db_name: "The target database's name, recorded in its checksum file"
cli.max_etc_seconds: "The longest estimated time, in seconds, a diff runs without --force"
cli.reference_checksum_file: "Generate the SQL from these reference checksums, with --target-checksum-file"
cli.target_checksum_file: "Generate the SQL from these target checksums, with --reference-checksum-file"
cli.save_reference_checksums: "Save the reference's checksums to this file"
cli.save_target_checksums: "Save the target's checksums to this file"
cli.checksum_only: "Compute and save the checksums only, no SQL"
cli.locale: "The language of the messages: en, ru, fr, de, zh, ja (default: LANG)"

# src/main.rs - the command line's progress and report: no code, none is an error
progress.table_start: "[%{index}/%{total}] %{table}"
progress.row_processed: "%{table}: %{count} rows"
progress.table_diff_complete: "%{table}: %{inserts} inserts, %{updates} updates"
progress.table_delete_complete: "%{table}: %{deletes} deletes"
progress.sorting_dependencies: "Ordering the tables by their foreign keys"
progress.estimation_start: "Estimating the time of %{total} tables"
progress.estimation_table_done: "%{table}: about %{seconds}s (%{strategy})"
progress.estimation_complete: "Estimated time: %{seconds}s"
progress.chunk_progress: "%{table}: chunk %{index}/%{total}"
report.header: "Data diff:"
report.no_differences: "  no differences"
report.table_line: "  %{table}: %{inserts} inserts, %{updates} updates, %{deletes} deletes"
report.master_script: "SQL: %{path}"
report.warnings_header: "Warnings:"
report.warning_line: "  %{message}"
