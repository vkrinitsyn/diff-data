# [i18n] diff_data's messages in Japanese (not reviewed): one file per language, every key in every
# file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, DA-Ennn, the same in every language (DD- is diff-doc's)
_version: 1

# src/ - the errors (DA-E001..E027): each starts with its code, the same in every language; its
# description is at docs.dbinvent.com. A new error takes the next code; a code is never reused
error.postgres: "DA-E001 PostgreSQL エラー：%{err}"
error.io: "DA-E002 入出力エラー：%{err}"
error.pool: "DA-E003 接続プールのエラー：%{err}"
error.no_primary_key: "DA-E004 テーブル %{table} に主キーがありません"
error.table_not_found: "DA-E005 テーブルが見つかりません：%{table}"
error.column_mismatch: "DA-E006 対象テーブル %{target} に参照テーブル %{reference} の列がありません"
error.cancelled: "DA-E007 比較は取り消されました"
error.yaml: "DA-E008 チェックサムファイルの YAML エラー：%{err}"
error.connection_string: "DA-E009 接続文字列が正しくありません：%{err}"
error.pool_create: "DA-E010 接続プールを作成できません：%{err}"
error.checksum_only_no_file: "DA-E011 checksum_only には save_reference_checksums か save_target_checksums が必要です：チェックサムの保存先"
error.no_reference_checksums: "DA-E012 チェックサムからの SQL には reference_checksum_file が必要です"
error.no_target_checksums: "DA-E013 チェックサムからの SQL には target_checksum_file が必要です"
error.stream_lock: "DA-E014 出力ストリームをロックできません：%{err}"
error.too_long: "DA-E015 推定時間 %{seconds} 秒（%{hours} 時間）が許容の %{max} 秒を超えています：force で強制実行できます"
error.large_no_timestamp: "DA-E016 テーブル %{table} は 100 万行を超え、タイムスタンプ列がありません：列を指定する（timestamp_column）か、テーブルを exclude_tables に加えて行ごとに比較してください"
error.checksum_open: "DA-E017 チェックサムファイル %{path} を開けません：%{err}"
error.reference_db: "DA-E018 参照データベース：%{err}"
error.target_db: "DA-E019 対象データベース：%{err}"
error.alternate_key: "DA-E020 代替キー %{value}：テーブル:列[,列...] の形式で指定してください"
error.no_key_reference_checksums: "DA-E021 テーブル %{table} に主キーがありません：参照側のチェックサムはありません"
error.no_key_target_checksums: "DA-E022 テーブル %{table} に主キーがありません：対象側のチェックサムはありません"
error.cluster_no_key: "DA-E023 主キーがありません：行を比較するための識別子がありません"
error.cluster_key_ignored: "DA-E024 %{column} はキーにも ignore_col にも含まれています"
error.cluster_ambiguous_id: "DA-E025 2 行が同じ id [%{id}] になります：キー値に '|' が含まれるか、浮動小数点のキーです - 行を一意に比較できません"
error.recon_frame_key: "DA-E026 フレームキー [%{key}] は単純な列名ではありません"
error.recon_ts_col: "DA-E027 最終更新列 [%{column}] は単純な列名ではありません"

# src/main.rs - the command line's help
cli.about: "2 つの PostgreSQL データベースのデータを比較し、対象の行を参照の行と同じにする SQL（INSERT、UPDATE、DELETE）を書き出します。データのみ：スキーマとデータの完全な比較には、スキーマを比較する sge（Schema Guard Enterprise）を使ってください。diff_data は sge、ytctl などのプロジェクト向けのライブラリでもあります。翻訳は未校閲です。"
cli.reference_url: "参照データベースの接続文字列：対象をこれと同じ行にします"
cli.target_url: "対象データベースの接続文字列：SQL が変更する行"
cli.output: "SQL のマスタースクリプト。--single-file では唯一の SQL ファイル"
cli.output_dir: "テーブルごとの SQL ファイルのディレクトリ（既定：マスタースクリプトのもの）"
cli.table: "比較するテーブル：名前、または 参照:対象。繰り返し可（既定：--reference-schema のすべてのテーブル）"
cli.include_delete: "参照にない対象の行の DELETE も書き出します"
cli.chunk_size: "1 回のクエリで比較する行数"
cli.ignore_column: "比較しない列。繰り返し可"
cli.alternate_key: "主キーの代わりに行を照合するキー：テーブル:列1,列2。繰り返し可"
cli.exclude_real_pk: "--alternate-key のとき、本来の主キーを INSERT に含めません"
cli.exclude_ignored_columns: "--ignore-column の列を SQL に含めません"
cli.where_condition: "参照の行に対する条件（WHERE なし）：条件に合う行だけを比較します"
cli.single_file: "テーブルごとのファイルではなく、すべての SQL を --output のファイルに書きます"
cli.reference_schema: "参照スキーマ：--table がなければ、そのすべてのテーブルを比較します"
cli.target_schema: "それらのテーブルの対象スキーマ（既定：--reference-schema）"
cli.exclude_table: "100 万行を超えタイムスタンプ列のないテーブルを、拒否せず行ごとに比較します。繰り返し可"
cli.no_check_dependencies: "外部キーでテーブルを並べ替えません"
cli.include_identity: "INSERT に ID 列を書き込みます"
cli.exclude_identity: "INSERT に ID 列を含めません（既定）"
cli.timestamp_column: "大きなテーブルを分割するタイムスタンプ列（既定：update* 列、なければ create* 列）"
cli.force: "推定時間が --max-etc-seconds を超えても実行します"
cli.no_progress: "進行状況を表示しません"
cli.reference_db_name: "参照データベースの名前。チェックサムファイルに記録されます"
cli.target_db_name: "対象データベースの名前。チェックサムファイルに記録されます"
cli.max_etc_seconds: "--force なしで実行できる最長の推定時間（秒）"
cli.reference_checksum_file: "この参照のチェックサムから SQL を生成します（--target-checksum-file と併用）"
cli.target_checksum_file: "この対象のチェックサムから SQL を生成します（--reference-checksum-file と併用）"
cli.save_reference_checksums: "参照のチェックサムをこのファイルに保存します"
cli.save_target_checksums: "対象のチェックサムをこのファイルに保存します"
cli.checksum_only: "チェックサムの計算と保存のみ行い、SQL は書きません"
cli.locale: "メッセージの言語：en、ru、fr、de、zh、ja（既定：LANG）"

# src/main.rs - the command line's progress and report: no code, none is an error
progress.table_start: "[%{index}/%{total}] %{table}"
progress.row_processed: "%{table}：%{count} 行"
progress.table_diff_complete: "%{table}：挿入 %{inserts}、更新 %{updates}"
progress.table_delete_complete: "%{table}：削除 %{deletes}"
progress.sorting_dependencies: "外部キーに従ってテーブルを並べ替えています"
progress.estimation_start: "%{total} 個のテーブルの所要時間を見積もっています"
progress.estimation_table_done: "%{table}：約 %{seconds} 秒（%{strategy}）"
progress.estimation_complete: "推定時間：%{seconds} 秒"
progress.chunk_progress: "%{table}：チャンク %{index}/%{total}"
report.header: "データ比較："
report.no_differences: "  差異はありません"
report.table_line: "  %{table}：挿入 %{inserts}、更新 %{updates}、削除 %{deletes}"
report.master_script: "SQL：%{path}"
report.warnings_header: "警告："
report.warning_line: "  %{message}"
