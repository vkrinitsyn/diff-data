# [i18n] diff_data's messages in German (not reviewed): one file per language, every key in every
# file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, DA-Ennn, the same in every language (DD- is diff-doc's)
_version: 1

# src/ - the errors (DA-E001..E027): each starts with its code, the same in every language; its
# description is at docs.dbinvent.com. A new error takes the next code; a code is never reused
error.postgres: "DA-E001 PostgreSQL-Fehler: %{err}"
error.io: "DA-E002 E/A-Fehler: %{err}"
error.pool: "DA-E003 Fehler des Verbindungspools: %{err}"
error.no_primary_key: "DA-E004 Tabelle %{table} hat keinen Primärschlüssel"
error.table_not_found: "DA-E005 Tabelle nicht gefunden: %{table}"
error.column_mismatch: "DA-E006 der Zieltabelle %{target} fehlen Spalten der Referenztabelle %{reference}"
error.cancelled: "DA-E007 der Vergleich wurde abgebrochen"
error.yaml: "DA-E008 YAML-Fehler der Prüfsummendatei: %{err}"
error.connection_string: "DA-E009 ungültige Verbindungszeichenfolge: %{err}"
error.pool_create: "DA-E010 der Verbindungspool kann nicht erstellt werden: %{err}"
error.checksum_only_no_file: "DA-E011 checksum_only braucht save_reference_checksums oder save_target_checksums: wohin die Prüfsummen gespeichert werden"
error.no_reference_checksums: "DA-E012 SQL aus Prüfsummen braucht reference_checksum_file"
error.no_target_checksums: "DA-E013 SQL aus Prüfsummen braucht target_checksum_file"
error.stream_lock: "DA-E014 der Ausgabestrom kann nicht gesperrt werden: %{err}"
error.too_long: "DA-E015 die geschätzte Dauer, %{seconds} s (%{hours} h), übersteigt die erlaubten %{max} s: force startet den Vergleich trotzdem"
error.large_no_timestamp: "DA-E016 Tabelle %{table} hat über 1 Mio. Zeilen und keine Zeitstempelspalte: nennen Sie eine (timestamp_column) oder nehmen Sie die Tabelle in exclude_tables auf, um sie zeilenweise zu vergleichen"
error.checksum_open: "DA-E017 die Prüfsummendatei %{path} kann nicht geöffnet werden: %{err}"
error.reference_db: "DA-E018 die Referenzdatenbank: %{err}"
error.target_db: "DA-E019 die Zieldatenbank: %{err}"
error.alternate_key: "DA-E020 Alternativschlüssel %{value}: erwartet Tabelle:Spalte[,Spalte...]"
error.no_key_reference_checksums: "DA-E021 Tabelle %{table} hat keinen Primärschlüssel: sie hat keine Referenzprüfsummen"
error.no_key_target_checksums: "DA-E022 Tabelle %{table} hat keinen Primärschlüssel: sie hat keine Zielprüfsummen"
error.cluster_no_key: "DA-E023 kein Primärschlüssel: ihre Zeilen haben keine Identität für den Vergleich"
error.cluster_key_ignored: "DA-E024 %{column} ist im Schlüssel und in ignore_col"
error.cluster_ambiguous_id: "DA-E025 zwei Zeilen ergeben die ID [%{id}]: ein Schlüsselwert mit '|' oder ein Gleitkommaschlüssel - ihre Zeilen haben keine eindeutige Identität für den Vergleich"
error.recon_frame_key: "DA-E026 der Frame-Schlüssel [%{key}] ist kein einfacher Spaltenname"
error.recon_ts_col: "DA-E027 die Spalte der letzten Änderung [%{column}] ist kein einfacher Spaltenname"

# src/main.rs - the command line's help
cli.about: "Vergleicht die Daten zweier PostgreSQL-Datenbanken und schreibt das SQL (INSERT, UPDATE, DELETE), das die Zeilen des Ziels denen der Referenz angleicht. Nur Daten: für einen vollständigen Vergleich, Schema und Daten, nutzen Sie sge (Schema Guard Enterprise), das die Schemas vergleicht. diff_data ist auch eine Bibliothek, für sge, ytctl oder jedes Projekt. Übersetzung nicht geprüft."
cli.reference_url: "Verbindungszeichenfolge der Referenzdatenbank: die Zeilen, denen das Ziel angeglichen wird"
cli.target_url: "Verbindungszeichenfolge der Zieldatenbank: die Zeilen, die das SQL ändert"
cli.output: "Das SQL-Hauptskript, oder mit --single-file die eine SQL-Datei"
cli.output_dir: "Verzeichnis der SQL-Dateien je Tabelle (Standard: das des Hauptskripts)"
cli.table: "Eine zu vergleichende Tabelle: Name oder Referenz:Ziel; wiederholbar (Standard: jede Tabelle von --reference-schema)"
cli.include_delete: "Auch DELETEs für Zeilen des Ziels schreiben, die der Referenz fehlen"
cli.chunk_size: "Zeilen, die eine Abfrage vergleicht"
cli.ignore_column: "Eine nicht verglichene Spalte; wiederholbar"
cli.alternate_key: "Ein Schlüssel, nach dem Zeilen statt nach dem Primärschlüssel zugeordnet werden: Tabelle:Spalte1,Spalte2; wiederholbar"
cli.exclude_real_pk: "Mit --alternate-key den echten Primärschlüssel aus INSERTs weglassen"
cli.exclude_ignored_columns: "Die Spalten von --ignore-column aus dem SQL weglassen"
cli.where_condition: "Eine Bedingung für die Zeilen der Referenz, ohne WHERE: nur die ausgewählten Zeilen werden verglichen"
cli.single_file: "Das gesamte SQL in die Datei --output statt in eine Datei je Tabelle schreiben"
cli.reference_schema: "Das Referenzschema: ohne --table wird jede seiner Tabellen verglichen"
cli.target_schema: "Das Zielschema dieser Tabellen (Standard: --reference-schema)"
cli.exclude_table: "Eine Tabelle mit über 1 Mio. Zeilen ohne Zeitstempelspalte, zeilenweise verglichen statt abgelehnt; wiederholbar"
cli.no_check_dependencies: "Die Tabellen nicht nach ihren Fremdschlüsseln ordnen"
cli.include_identity: "Identitätsspalten in INSERTs schreiben"
cli.exclude_identity: "Identitätsspalten aus INSERTs weglassen (Standard)"
cli.timestamp_column: "Die Zeitstempelspalte, nach der eine große Tabelle aufgeteilt wird (Standard: eine update*-, sonst eine create*-Spalte)"
cli.force: "Auch starten, wenn die geschätzte Dauer --max-etc-seconds übersteigt"
cli.no_progress: "Keinen Fortschritt ausgeben"
cli.reference_db_name: "Der Name der Referenzdatenbank, in ihrer Prüfsummendatei vermerkt"
cli.target_db_name: "Der Name der Zieldatenbank, in ihrer Prüfsummendatei vermerkt"
cli.max_etc_seconds: "Die längste geschätzte Dauer in Sekunden, die ein Vergleich ohne --force läuft"
cli.reference_checksum_file: "Das SQL aus diesen Prüfsummen der Referenz erzeugen, mit --target-checksum-file"
cli.target_checksum_file: "Das SQL aus diesen Prüfsummen des Ziels erzeugen, mit --reference-checksum-file"
cli.save_reference_checksums: "Die Prüfsummen der Referenz in diese Datei speichern"
cli.save_target_checksums: "Die Prüfsummen des Ziels in diese Datei speichern"
cli.checksum_only: "Nur die Prüfsummen berechnen und speichern, kein SQL"
cli.locale: "Die Sprache der Meldungen: en, ru, fr, de, zh, ja (Standard: LANG)"

# src/main.rs - the command line's progress and report: no code, none is an error
progress.table_start: "[%{index}/%{total}] %{table}"
progress.row_processed: "%{table}: %{count} Zeilen"
progress.table_diff_complete: "%{table}: %{inserts} Einfügungen, %{updates} Änderungen"
progress.table_delete_complete: "%{table}: %{deletes} Löschungen"
progress.sorting_dependencies: "Tabellen werden nach ihren Fremdschlüsseln geordnet"
progress.estimation_start: "Dauer für %{total} Tabellen wird geschätzt"
progress.estimation_table_done: "%{table}: etwa %{seconds} s (%{strategy})"
progress.estimation_complete: "Geschätzte Dauer: %{seconds} s"
progress.chunk_progress: "%{table}: Abschnitt %{index}/%{total}"
report.header: "Datenvergleich:"
report.no_differences: "  keine Unterschiede"
report.table_line: "  %{table}: %{inserts} Einfügungen, %{updates} Änderungen, %{deletes} Löschungen"
report.master_script: "SQL: %{path}"
report.warnings_header: "Warnungen:"
report.warning_line: "  %{message}"
