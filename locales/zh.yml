# [i18n] diff_data's messages in Simplified Chinese (not reviewed): one file per language, every key in every
# file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, DA-Ennn, the same in every language (DD- is diff-doc's)
_version: 1

# src/ - the errors (DA-E001..E027): each starts with its code, the same in every language; its
# description is at docs.dbinvent.com. A new error takes the next code; a code is never reused
error.postgres: "DA-E001 PostgreSQL 错误：%{err}"
error.io: "DA-E002 输入/输出错误：%{err}"
error.pool: "DA-E003 连接池错误：%{err}"
error.no_primary_key: "DA-E004 表 %{table} 没有主键"
error.table_not_found: "DA-E005 未找到表：%{table}"
error.column_mismatch: "DA-E006 目标表 %{target} 缺少参照表 %{reference} 的列"
error.cancelled: "DA-E007 比较已取消"
error.yaml: "DA-E008 校验和文件 YAML 错误：%{err}"
error.connection_string: "DA-E009 无效的连接字符串：%{err}"
error.pool_create: "DA-E010 无法创建连接池：%{err}"
error.checksum_only_no_file: "DA-E011 checksum_only 需要 save_reference_checksums 或 save_target_checksums：校验和的保存位置"
error.no_reference_checksums: "DA-E012 根据校验和生成 SQL 需要 reference_checksum_file"
error.no_target_checksums: "DA-E013 根据校验和生成 SQL 需要 target_checksum_file"
error.stream_lock: "DA-E014 无法锁定输出流：%{err}"
error.too_long: "DA-E015 预计耗时 %{seconds} 秒（%{hours} 小时），超过允许的 %{max} 秒：使用 force 仍可运行"
error.large_no_timestamp: "DA-E016 表 %{table} 超过 100 万行且没有时间戳列：请指定一列（timestamp_column），或将该表加入 exclude_tables 以逐行比较"
error.checksum_open: "DA-E017 无法打开校验和文件 %{path}：%{err}"
error.reference_db: "DA-E018 参照数据库：%{err}"
error.target_db: "DA-E019 目标数据库：%{err}"
error.alternate_key: "DA-E020 备用键 %{value}：应为 表:列[,列...]"
error.no_key_reference_checksums: "DA-E021 表 %{table} 没有主键：没有它的参照校验和"
error.no_key_target_checksums: "DA-E022 表 %{table} 没有主键：没有它的目标校验和"
error.cluster_no_key: "DA-E023 没有主键：其行没有可用于比较的标识"
error.cluster_key_ignored: "DA-E024 %{column} 既在键中又在 ignore_col 中"
error.cluster_ambiguous_id: "DA-E025 两行生成相同的 id [%{id}]：键值包含 '|'，或键为浮点数 - 其行没有唯一标识可供比较"
error.recon_frame_key: "DA-E026 帧键 [%{key}] 不是普通列名"
error.recon_ts_col: "DA-E027 最后更新列 [%{column}] 不是普通列名"

# src/main.rs - the command line's help
cli.about: "比较两个 PostgreSQL 数据库的数据，并生成使目标库的行与参照库一致的 SQL（INSERT、UPDATE、DELETE）。仅限数据：如需完整比较（模式和数据），请使用 sge（Schema Guard Enterprise），由它比较模式。diff_data 也是一个库，可供 sge、ytctl 或任何项目使用。译文未经审校。"
cli.reference_url: "参照数据库的连接字符串：目标库要与之一致的行"
cli.target_url: "目标数据库的连接字符串：SQL 要修改的行"
cli.output: "SQL 主脚本；使用 --single-file 时为唯一的 SQL 文件"
cli.output_dir: "每个表的 SQL 文件所在目录（默认：主脚本所在目录）"
cli.table: "要比较的表：名称，或 参照:目标；可重复（默认：--reference-schema 中的所有表）"
cli.include_delete: "同时为参照库中没有的目标行生成 DELETE"
cli.chunk_size: "每次查询比较的行数"
cli.ignore_column: "不参与比较的列；可重复"
cli.alternate_key: "代替主键用于匹配行的键：表:列1,列2；可重复"
cli.exclude_real_pk: "与 --alternate-key 一起使用时，INSERT 中不写真正的主键"
cli.exclude_ignored_columns: "SQL 中不写 --ignore-column 的列"
cli.where_condition: "对参照行的条件（不含 WHERE）：只比较满足条件的行"
cli.single_file: "将全部 SQL 写入 --output 文件，而不是每个表一个文件"
cli.reference_schema: "参照模式：未指定 --table 时，比较其中的每个表"
cli.target_schema: "这些表在目标库中的模式（默认：--reference-schema）"
cli.exclude_table: "超过 100 万行且没有时间戳列的表，逐行比较而不是拒绝；可重复"
cli.no_check_dependencies: "不按外键对表排序"
cli.include_identity: "在 INSERT 中写入标识列"
cli.exclude_identity: "INSERT 中不写标识列（默认）"
cli.timestamp_column: "用于给大表分块的时间戳列（默认：update* 列，否则 create* 列）"
cli.force: "即使预计耗时超过 --max-etc-seconds 也运行"
cli.no_progress: "不显示进度"
cli.reference_db_name: "参照数据库的名称，记录在其校验和文件中"
cli.target_db_name: "目标数据库的名称，记录在其校验和文件中"
cli.max_etc_seconds: "不使用 --force 时允许的最长预计耗时（秒）"
cli.reference_checksum_file: "根据这些参照校验和生成 SQL，需配合 --target-checksum-file"
cli.target_checksum_file: "根据这些目标校验和生成 SQL，需配合 --reference-checksum-file"
cli.save_reference_checksums: "将参照库的校验和保存到此文件"
cli.save_target_checksums: "将目标库的校验和保存到此文件"
cli.checksum_only: "只计算并保存校验和，不生成 SQL"
cli.locale: "消息语言：en、ru、fr、de、zh、ja（默认：LANG）"

# src/main.rs - the command line's progress and report: no code, none is an error
progress.table_start: "[%{index}/%{total}] %{table}"
progress.row_processed: "%{table}：%{count} 行"
progress.table_diff_complete: "%{table}：插入 %{inserts}，更新 %{updates}"
progress.table_delete_complete: "%{table}：删除 %{deletes}"
progress.sorting_dependencies: "按外键对表排序"
progress.estimation_start: "正在估算 %{total} 个表的耗时"
progress.estimation_table_done: "%{table}：约 %{seconds} 秒（%{strategy}）"
progress.estimation_complete: "预计耗时：%{seconds} 秒"
progress.chunk_progress: "%{table}：分块 %{index}/%{total}"
report.header: "数据比较："
report.no_differences: "  没有差异"
report.table_line: "  %{table}：插入 %{inserts}，更新 %{updates}，删除 %{deletes}"
report.master_script: "SQL：%{path}"
report.warnings_header: "警告："
report.warning_line: "  %{message}"
