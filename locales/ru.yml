# [i18n] diff_data's messages in Russian: one file per language, every key in every
# file (src/i18n.rs tests it). Keys are `module.name`, as tr!("module.name") asks for them;
# an error's message starts with its code, DA-Ennn, the same in every language (DD- is diff-doc's)
_version: 1

# src/ - the errors (DA-E001..E027): each starts with its code, the same in every language; its
# description is at docs.dbinvent.com. A new error takes the next code; a code is never reused
error.postgres: "DA-E001 ошибка PostgreSQL: %{err}"
error.io: "DA-E002 ошибка ввода-вывода: %{err}"
error.pool: "DA-E003 ошибка пула соединений: %{err}"
error.no_primary_key: "DA-E004 у таблицы %{table} нет первичного ключа"
error.table_not_found: "DA-E005 таблица не найдена: %{table}"
error.column_mismatch: "DA-E006 в целевой таблице %{target} нет столбцов эталонной таблицы %{reference}"
error.cancelled: "DA-E007 сравнение отменено"
error.yaml: "DA-E008 ошибка YAML в файле контрольных сумм: %{err}"
error.connection_string: "DA-E009 неверная строка подключения: %{err}"
error.pool_create: "DA-E010 не удалось создать пул соединений: %{err}"
error.checksum_only_no_file: "DA-E011 для checksum_only нужен save_reference_checksums или save_target_checksums: куда сохранить контрольные суммы"
error.no_reference_checksums: "DA-E012 для SQL по контрольным суммам нужен reference_checksum_file"
error.no_target_checksums: "DA-E013 для SQL по контрольным суммам нужен target_checksum_file"
error.stream_lock: "DA-E014 не удалось заблокировать выходной поток: %{err}"
error.too_long: "DA-E015 оценка времени, %{seconds} с (%{hours} ч), больше допустимых %{max} с: force запускает сравнение всё равно"
error.large_no_timestamp: "DA-E016 в таблице %{table} больше 1 млн строк и нет столбца времени: укажите его (timestamp_column) или добавьте таблицу в exclude_tables, чтобы сравнить её построчно"
error.checksum_open: "DA-E017 не удалось открыть файл контрольных сумм %{path}: %{err}"
error.reference_db: "DA-E018 эталонная база: %{err}"
error.target_db: "DA-E019 целевая база: %{err}"
error.alternate_key: "DA-E020 альтернативный ключ %{value}: ожидается таблица:столбец[,столбец...]"
error.no_key_reference_checksums: "DA-E021 у таблицы %{table} нет первичного ключа: эталонных контрольных сумм у неё нет"
error.no_key_target_checksums: "DA-E022 у таблицы %{table} нет первичного ключа: целевых контрольных сумм у неё нет"
error.cluster_no_key: "DA-E023 нет первичного ключа: у строк нет идентичности для сравнения"
error.cluster_key_ignored: "DA-E024 %{column} входит и в ключ, и в ignore_col"
error.cluster_ambiguous_id: "DA-E025 две строки дают один id [%{id}]: значение ключа содержит '|' или ключ дробный - у строк нет однозначной идентичности для сравнения"
error.recon_frame_key: "DA-E026 ключ фрейма [%{key}] - не простое имя столбца"
error.recon_ts_col: "DA-E027 столбец последнего изменения [%{column}] - не простое имя столбца"

# src/main.rs - the command line's help
cli.about: "Сравнивает данные двух баз PostgreSQL и пишет SQL (INSERT, UPDATE, DELETE), после которого строки целевой базы совпадают с эталонной. Только данные: для полного сравнения, схемы и данных, используйте sge (Schema Guard Enterprise), который сравнивает схемы. diff_data также библиотека, для sge, ytctl или любого проекта."
cli.reference_url: "Строка подключения к эталонной базе: строки, с которыми выравнивается целевая"
cli.target_url: "Строка подключения к целевой базе: строки, которые меняет SQL"
cli.output: "Главный SQL-скрипт или, с --single-file, единственный файл SQL"
cli.output_dir: "Каталог SQL-файлов таблиц (по умолчанию каталог главного скрипта)"
cli.table: "Таблица для сравнения: имя или эталон:цель; можно повторять (по умолчанию все таблицы --reference-schema)"
cli.include_delete: "Также писать DELETE для строк цели, которых нет в эталоне"
cli.chunk_size: "Строк, сравниваемых одним запросом"
cli.ignore_column: "Столбец, который не сравнивается; можно повторять"
cli.alternate_key: "Ключ для сопоставления строк вместо первичного: таблица:столбец1,столбец2; можно повторять"
cli.exclude_real_pk: "С --alternate-key не писать настоящий первичный ключ в INSERT"
cli.exclude_ignored_columns: "Не писать столбцы --ignore-column в SQL"
cli.where_condition: "Условие на строки эталона, без WHERE: сравниваются только отобранные строки"
cli.single_file: "Писать весь SQL в файл --output вместо файла на таблицу"
cli.reference_schema: "Схема эталона: без --table сравниваются все её таблицы"
cli.target_schema: "Схема цели для этих таблиц (по умолчанию --reference-schema)"
cli.exclude_table: "Таблица больше 1 млн строк без столбца времени, сравниваемая построчно, а не отклоняемая; можно повторять"
cli.no_check_dependencies: "Не упорядочивать таблицы по внешним ключам"
cli.include_identity: "Писать столбцы identity в INSERT"
cli.exclude_identity: "Не писать столбцы identity в INSERT (по умолчанию)"
cli.timestamp_column: "Столбец времени, по которому делится большая таблица (по умолчанию update*, иначе create*)"
cli.force: "Запускать, даже если оценка времени больше --max-etc-seconds"
cli.no_progress: "Не выводить ход выполнения"
cli.reference_db_name: "Имя эталонной базы, записываемое в её файл контрольных сумм"
cli.target_db_name: "Имя целевой базы, записываемое в её файл контрольных сумм"
cli.max_etc_seconds: "Наибольшая оценка времени в секундах, при которой сравнение идёт без --force"
cli.reference_checksum_file: "Генерировать SQL по этим контрольным суммам эталона, вместе с --target-checksum-file"
cli.target_checksum_file: "Генерировать SQL по этим контрольным суммам цели, вместе с --reference-checksum-file"
cli.save_reference_checksums: "Сохранить контрольные суммы эталона в этот файл"
cli.save_target_checksums: "Сохранить контрольные суммы цели в этот файл"
cli.checksum_only: "Только вычислить и сохранить контрольные суммы, без SQL"
cli.locale: "Язык сообщений: en, ru, fr, de, zh, ja (по умолчанию LANG)"

# src/main.rs - the command line's progress and report: no code, none is an error
progress.table_start: "[%{index}/%{total}] %{table}"
progress.row_processed: "%{table}: строк %{count}"
progress.table_diff_complete: "%{table}: вставок %{inserts}, изменений %{updates}"
progress.table_delete_complete: "%{table}: удалений %{deletes}"
progress.sorting_dependencies: "Упорядочение таблиц по внешним ключам"
progress.estimation_start: "Оценка времени для таблиц: %{total}"
progress.estimation_table_done: "%{table}: около %{seconds} с (%{strategy})"
progress.estimation_complete: "Оценка времени: %{seconds} с"
progress.chunk_progress: "%{table}: часть %{index}/%{total}"
report.header: "Сравнение данных:"
report.no_differences: "  различий нет"
report.table_line: "  %{table}: вставок %{inserts}, изменений %{updates}, удалений %{deletes}"
report.master_script: "SQL: %{path}"
report.warnings_header: "Предупреждения:"
report.warning_line: "  %{message}"
